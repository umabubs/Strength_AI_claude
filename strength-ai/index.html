   <button class="btn primary" data-act="b-new">+ Build a new programme</button>`)}
function doPlan(mode,id,l,scope){const c=customBy(id);if(!c)return;
  applyPlan(scope,L=>{dropFrom(L,id);if(mode==="rep")L.rep[l]=id;else if(!L.add.includes(id))L.add.push(id)});
  closeOverlay();render();toast(mode==="rep"?`${c.name} replaces ${l} ${scope==="week"?"this week":"every week"}`:`${c.name} added ${scope==="week"?"this week":"every week"}`)}
function go(hash,after){if(location.hash===hash||(hash==="#today"&&!location.hash)){render();window.scrollTo(0,0);if(after)after()}else{S.afterNav=after||null;location.hash=hash}}

/* groups */
function exRow(id){const e=EXBY[id];return `<button class="exrow" data-act="exsheet" data-ex="${id}"><div class="plate"><img src="${img(id)}" alt="" loading="lazy"></div><div style="min-width:0"><h3>${esc(e.n)}</h3><div class="mus">${esc(gNames(e.g))}</div><div class="badges">${usedIn(id)}${e.ty.map(t=>`<span class="tchip">${TBY[t].n}</span>`).join("")}</div></div><span class="muted" aria-hidden="true">›</span></button>`}
function viewGroups(){const mode=S.gview||"muscle";if(S.gsel)return groupDetail(mode,S.gsel);
  let h=`<section class="view"><div class="stack" style="gap:6px"><div class="eyebrow">Exercise groups</div><h1>Groups</h1><div class="muted">${mode==="muscle"?"Tap a muscle group to see every exercise that trains it.":"Every exercise sorted by equipment and training style."}</div></div>
   <div>${seg("gview",mode,[["muscle","By muscle"],["type","By type"]],"gview")}</div>`;
  if(mode==="muscle")h+=`<div class="gtiles">${MUSCLES.map(m=>{const a=exFor("m:"+m.id).length;return `<button class="gtile" data-act="gsel" data-id="${m.id}">${bodySVG([m.id],[],"body",m.n)}<h3>${m.n}</h3><span class="muted">${esc(m.sci)}</span><span class="muted">${a} exercise${a===1?"":"s"}</span></button>`}).join("")}</div>`;
  else TYPE_GROUPS.forEach(G=>{h+=`<div class="sec-h"><div><h2>${G.n}</h2><span class="muted small">${G.d}</span></div></div><div class="gtiles">${TYPES.filter(t=>t.grp===G.id).map(t=>{const a=exFor("t:"+t.id).length;return `<button class="gtile" data-act="gsel" data-id="${t.id}"><div class="plate"><img src="${img(t.rep)}" alt="" loading="lazy"></div><h3>${t.n}</h3><span class="muted">${a} exercise${a===1?"":"s"}</span></button>`}).join("")}</div>`});
  return h+`<button class="btn" data-act="b-new">Build a custom programme</button></section>`}
function groupDetail(mode,id){const isM=mode==="muscle";const g=isM?MBY[id]:TBY[id];if(!g){S.gsel=null;return viewGroups()}
  let h=`<section class="view"><button class="btn ghost sm" data-act="gback" style="align-self:flex-start">‹ All ${isM?"muscle groups":"types"}</button>`;
  if(isM)h+=`<div class="ghero">${bodySVG([id],[],"body live",g.n)}<div class="stack" style="gap:6px;min-width:0"><div class="eyebrow">${esc(g.sci)}</div><h1 style="font-size:34px">${g.n}</h1><div class="small">${esc(g.does)}</div></div></div>`;
  else h+=`<div class="stack" style="gap:6px"><div class="eyebrow">${TYPE_GROUPS.find(x=>x.id===g.grp).n}</div><h1>${g.n}</h1><div class="muted">${esc(g.d)}</div></div>`;
  const main=isM?LIBRARY.filter(x=>EXBY[x].g.includes(id)):exFor("t:"+id);
  const also=isM?LIBRARY.filter(x=>!EXBY[x].g.includes(id)&&EXBY[x].g2.includes(id)):[];
  h+=`<div class="eyebrow" style="padding-top:4px">${isM?"Main exercises":"Exercises"} · ${main.length}</div><div class="stack" style="gap:8px">${main.map(exRow).join("")}</div>`;
  if(also.length)h+=`<div class="eyebrow" style="padding-top:4px">Also works the ${esc(g.n.toLowerCase())} · ${also.length}</div><div class="stack" style="gap:8px">${also.map(exRow).join("")}</div>`;
  return h+`<button class="btn primary" data-act="build-from" data-f="${isM?"m:":"t:"}${id}">Build a programme from ${esc(g.n.toLowerCase())}</button></section>`}
function openExSheet(id,still){const e=EXBY[id];const cs=S.settings.customs;
  sheet(e.n,`<div class="sheet-h"><h2>${esc(e.n)}</h2><button class="btn sm" data-act="close">Close</button></div>
   <button class="plate" style="aspect-ratio:16/9" data-act="zoom" data-ex="${id}" aria-label="Enlarge ${esc(e.n)}"><img src="${img(id)}" alt="${esc(e.n)}"></button>${DEMOS[id]?`<button class="btn demo-b" data-act="demo" data-ex="${id}"><span aria-hidden="true">▶</span> Watch the technique demo</button>`:""}
   <div class="ghero" style="grid-template-columns:minmax(0,120px) minmax(0,1fr);padding:10px">${bodySVG(e.g,e.g2,"body live",e.n)}<dl class="mini"><dt>Main</dt><dd>${esc(gNames(e.g))}</dd>${e.g2.length?`<dt>Also</dt><dd>${esc(gNames(e.g2))}</dd>`:""}<dt>Type</dt><dd>${e.ty.map(t=>TBY[t].n).join(", ")}</dd><dt>Plan</dt><dd>${e.s>1?e.s+" × ":""}${esc(e.r)}</dd></dl></div>
   <div class="small">${esc(e.c)}</div><div class="badges">${usedIn(id)}</div>
   <div class="eyebrow">Add to a custom programme</div><div class="stack" style="gap:6px">${cs.map(c=>{const has=c.ex.some(x=>x.id===id);return `<button class="btn" data-act="addto" data-c="${c.id}" data-ex="${id}" ${has?"disabled":""}>${has?"✓ Already in ":"+ Add to "}${esc(c.name)}</button>`}).join("")}<button class="btn primary" data-act="addnew" data-ex="${id}">+ New programme with this exercise</button></div>`,still)}

/* calendar */
function sessCard(s,open){const v=sessVolume(s);const dt=new Date(s.date+"T12:00");const np=(s.prs||[]).length;
  let h=`<div class="sess"><button data-act="open" data-id="${s.id}" aria-expanded="${open}"><div class="datebox" style="box-shadow:inset 0 3px 0 var(${wvar(s.workout)})"><div class="d">${dt.getDate()}</div><div class="m">${dt.toLocaleDateString(undefined,{month:"short"})}</div></div><div style="min-width:0"><h3>${esc(sessName(s))} <span class="muted small" style="font-family:var(--body)">· Week ${s.week}${s.oneoff?" · one-off":""}</span>${np?` <span class="prbadge">${np} PR${np>1?"s":""}</span>`:""}</h3><span class="muted small">${v.n} sets${v.v?` · ${Math.round(v.v).toLocaleString()} kg`:""}${s.mins?` · ${s.mins} min`:""}${cardioTot(s)?` · ${cardioTot(s)} min cardio`:""}${s.local&&HOST!=="pwa"?" · not synced yet":""}</span></div><span class="muted">${open?"−":"+"}</span></button>`;
  if(open){h+=`<div class="detail">`;for(const k in s.entries){const e=EXBY[k];const sets=loggedSets(s.entries[k]);if(!sets.length||!e)continue;h+=`<div class="line"><span>${esc(e.n)}${sets.some(x=>x.pr)?' <span class="prbadge">PR</span>':""}</span><span>${sets.map(x=>(num(x.kg)!=null&&!repsMode(e)?fmt(num(x.kg))+"×":"")+esc(x.reps)+(e.u==="sec"?"s":"")).join("  ")}</span></div>`}
    (s.cardio||[]).forEach(c=>{h+=`<div class="line"><span>${esc((CARDIO_BY[c.id]||{n:c.id}).n)}</span><span>${esc(c.min)} min</span></div>`});
    if(s.notes)h+=`<div class="snote"><span class="eyebrow">Notes</span><p>${esc(s.notes)}</p></div>`;
    h+=S.confirm==="del:"+s.id?`<div class="row"><span class="small">Delete this workout for good?</span><button class="btn danger" data-act="del-yes" data-id="${s.id}">Delete</button><button class="btn" data-act="cancel">Cancel</button></div>`:`<div><button class="btn ghost small" data-act="del" data-id="${s.id}">Delete workout</button></div>`;
    h+=`</div>`}
  return h+`</div>`}
function viewCalendar(){const today=todayISO();const ym=S.calMonth||today.slice(0,7);const [y,m]=ym.split("-").map(Number);
  const first=new Date(y,m-1,1);const nd=new Date(y,m,0).getDate();const lead=(first.getDay()+6)%7;
  const mon=S.sessions.filter(s=>s.date&&s.date.slice(0,7)===ym);const by={};mon.forEach(s=>(by[s.date]=by[s.date]||[]).push(s));
  const sel=S.calDay&&S.calDay.slice(0,7)===ym?S.calDay:null;
  const dows=[];for(let i=0;i<7;i++){const d=new Date(2024,0,1+i);dows.push(d.toLocaleDateString(undefined,{weekday:"short"}))}
  let cells="";for(let i=0;i<lead;i++)cells+=`<div class="cday out" aria-hidden="true"></div>`;
  for(let d=1;d<=nd;d++){const iso=ym+"-"+String(d).padStart(2,"0");const ss=by[iso]||[];
    cells+=`<button class="cday ${iso===today?"today":""}" data-act="calday" data-d="${iso}" aria-pressed="${iso===sel}" aria-label="${new Date(iso+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"long"})}${ss.length?": "+esc(ss.map(sessName).join(", ")):""}"><span class="dn">${d}</span>${ss.slice(0,2).map(s=>`<span class="w" style="background:var(${wvar(s.workout)})">${esc(wletter(s.workout,s.name))}</span>`).join("")}</button>`}
  const vol=mon.reduce((a,s)=>a+sessVolume(s).v,0);const mins=mon.reduce((a,s)=>a+(s.mins||0),0);
  const legend=WORKOUTS.map(w=>`<span><i style="background:var(${wvar(w.id)})"></i>${w.id} ${w.name}</span>`).join("")+`<span><i style="background:var(--wx)"></i>Custom</span>`;
  let h=`<section class="view"><div class="stack" style="gap:6px"><div class="eyebrow">Calendar</div><h1>Your training</h1><div class="muted">Each workout appears here automatically when you save it.</div></div>
   <div class="cal"><div class="cal-h"><button class="iconbtn" data-act="calnav" data-n="-1" aria-label="Previous month">‹</button><h2>${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><button class="iconbtn" data-act="calnav" data-n="1" aria-label="Next month">›</button></div>
   <div class="cal-grid">${dows.map(x=>`<div class="cal-dow">${esc(x)}</div>`).join("")}${cells}</div><div class="legend">${legend}</div></div>
   <div class="stats"><div class="stat"><b>${mon.length}</b><span>workouts</span></div><div class="stat"><b>${vol?Math.round(vol).toLocaleString():"–"}</b><span>kg lifted</span></div><div class="stat"><b>${mins||"–"}</b><span>minutes</span></div></div>`;
  if(ym!==today.slice(0,7))h+=`<button class="btn ghost small" data-act="calnav" data-n="0" style="align-self:center">Back to this month</button>`;
  const list=(sel?(by[sel]||[]):mon).slice().sort((a,b)=>(b.date+b.finishedAt).localeCompare(a.date+a.finishedAt));
  h+=`<div class="sec-h"><div><h2>${sel?new Date(sel+"T12:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}):"This month"}</h2><span class="muted small">${list.length?`${list.length} workout${list.length>1?"s":""}`:sel?"Rest day":"No workouts this month yet"}</span></div>${sel?`<button class="btn sm ghost" data-act="calday" data-d="${sel}">Whole month</button>`:""}</div>`;
  list.forEach(s=>h+=sessCard(s,S.openSess===s.id||(!!sel&&list.length===1)));
  if(!S.sessions.length)h+=`<div class="empty">No workouts saved yet. Log your sets on the Today tab and tap Finish workout.</div>`;
  return h+`<div class="note small"><span>Backups and exports are in <a href="#settings" style="color:var(--accent)">Settings</a>.</span></div></section>`}

/* palette */
function paletteRow(){const cur=prefGet("palette")||"chalk";return `<div class="srow"><div><b>Colour theme</b><span class="muted small">Changes the background and accent colours. Works with light and dark.</span></div><div class="swatches" role="radiogroup" aria-label="Colour theme">${PALS.map(p=>`<button class="sw" role="radio" aria-checked="${p.id===cur}" data-act="palette" data-v="${p.id}"><i style="background:linear-gradient(135deg,${p.sw[0]} 50%,${p.sw[1]} 50%)"></i>${p.n}</button>`).join("")}</div></div>`}

/* v3 events */
document.addEventListener("input",ev=>{const t=ev.target;if(!t.dataset||!t.dataset.bf||!S.build)return;const B=S.build;const f=t.dataset.bf;
  if(f==="name"){B.name=t.value;const sv=$("b-save");if(sv)sv.disabled=!(B.ex.length&&B.name.trim())}
  else if(f==="q"){B.q=t.value;$("b-list").innerHTML=bList()}
  else{const x=B.ex[+t.dataset.i];if(x)x[f]=t.value.trim()}});
document.addEventListener("change",ev=>{const t=ev.target;if(t.id==="b-filter"&&S.build){S.build.filter=t.value;$("b-list").innerHTML=bList()}});
document.addEventListener("click",ev=>{
  const tab=ev.target.closest("nav.tabs a");if(tab&&tab.getAttribute("href")==="#groups"&&route()==="groups"&&S.gsel){S.gsel=null;render();window.scrollTo(0,0);return}
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;const scope=S.planScope||"week";
  if(a==="gview"){S.gview=b.dataset.v;S.gsel=null;render()}
  else if(a==="gsel"){S.gsel=b.dataset.id;render();window.scrollTo(0,0)}
  else if(a==="gback"){S.gsel=null;render();window.scrollTo(0,0)}
  else if(a==="exsheet"){openExSheet(b.dataset.ex)}
  else if(a==="addto"){const c=customBy(b.dataset.c);if(c&&!c.ex.some(x=>x.id===b.dataset.ex)){c.ex.push(exDefaults(b.dataset.ex));saveSettings();openExSheet(b.dataset.ex,true);toast(`Added to ${c.name}`)}}
  else if(a==="addnew"){S.build=newBuild();S.build.ex.push(exDefaults(b.dataset.ex));closeOverlay();go("#build")}
  else if(a==="build-from"){S.build=newBuild();S.build.filter=b.dataset.f;go("#build")}
  else if(a==="b-new"){S.build=newBuild();closeOverlay();go("#build")}
  else if(a==="b-edit"){S.build=newBuild(customBy(b.dataset.c));go("#build")}
  else if(a==="b-toggle"){const B=S.build;const id=b.dataset.ex;const i=B.ex.findIndex(x=>x.id===id);if(i>=0)B.ex.splice(i,1);else B.ex.push(exDefaults(id));const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==="b-up"||a==="b-down"||a==="b-rm"){const B=S.build;const i=+b.dataset.i;if(a==="b-rm")B.ex.splice(i,1);else{const j=a==="b-up"?i-1:i+1;if(j<0||j>=B.ex.length)return;[B.ex[i],B.ex[j]]=[B.ex[j],B.ex[i]]}const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==="b-cancel"){S.build=null;go("#plan")}
  else if(a==="b-save"){const B=S.build;if(!B||!B.ex.length)return;const name=B.name.trim()||"Custom";
    const ex=B.ex.map(x=>{const e=EXBY[x.id];const o={id:x.id,s:Math.max(1,Math.min(10,parseInt(x.s)||e.s||3)),r:String(x.r||e.r||"")};if(e.k==="hold"||e.k==="stretch")o.t=Math.max(5,Math.min(600,parseInt(x.t)||e.t||30));return o});
    let c=B.id&&customBy(B.id);const isNew=!c;if(c){c.name=name;c.ex=ex}else{c={id:"c-"+Date.now().toString(36),name,ex,created:todayISO()};S.settings.customs.push(c)}
    const dw=S.draft&&S.draft.workouts&&S.draft.workouts[c.id];if(dw){for(const k in dw.entries)if(!ex.some(x=>x.id===k)&&!dw.entries[k].sets.some(s=>s.done||s.kg||s.reps))delete dw.entries[k];saveDraft()}
    saveSettings();S.build=null;const cid=c.id;go("#plan",()=>{if(isNew)openUseSheet(cid,true);else toast("Programme saved")})}
  else if(a==="use-open"){openUseSheet(b.dataset.c)}
  else if(a==="usescope"){S.useScope=b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",String(x===b)))}
  else if(a==="use-rep"){doPlan("rep",b.dataset.c,b.dataset.l,S.useScope||"week")}
  else if(a==="use-add"){doPlan("add",b.dataset.c,null,S.useScope||"week")}
  else if(a==="use-today"){ensureDraft();S.draft.current=b.dataset.c;S.confirm=null;S.round={};ensureDraft();saveDraft();closeOverlay();go("#today")}
  else if(a==="planscope"){S.planScope=b.dataset.v;render()}
  else if(a==="plan-swap"){openPick("rep",b.dataset.l)}
  else if(a==="plan-addextra"){openPick("add")}
  else if(a==="pick-c"){doPlan(b.dataset.mode,b.dataset.c,b.dataset.l,scope)}
  else if(a==="plan-restore"){const l=b.dataset.l;applyPlan(scope,L=>{delete L.rep[l]});render();toast(`${l} is back to ${WBY[l].name.toLowerCase()}`)}
  else if(a==="plan-unadd"){const id=b.dataset.c;applyPlan(scope,L=>{L.add=L.add.filter(x=>x!==id)});render()}
  else if(a==="plan-reset"){const k=weekKey();if(k)delete S.settings.plan.weeks[k];saveSettings();render();toast("This week is back to your usual plan")}
  else if(a==="c-del"){S.confirm="cdel:"+b.dataset.c;render()}
  else if(a==="c-del-yes"){const id=b.dataset.c;const p=S.settings.plan;dropFrom(p.base,id);for(const k in p.weeks)dropFrom(p.weeks[k],id);S.settings.customs=S.settings.customs.filter(c=>c.id!==id);
    if(S.draft&&S.draft.workouts){delete S.draft.workouts[id];if(S.draft.current===id)S.draft.current=nextWorkout()}S.confirm=null;saveSettings();saveDraft();render();toast("Programme deleted")}
  else if(a==="calnav"){const n=+b.dataset.n;if(!n)S.calMonth=null;else{const [y,m]=(S.calMonth||todayISO().slice(0,7)).split("-").map(Number);const d=new Date(y,m-1+n,1);S.calMonth=toISO(d).slice(0,7)}S.calDay=null;render()}
  else if(a==="calday"){S.calDay=S.calDay===b.dataset.d?null:b.dataset.d;S.openSess=null;render()}
  else if(a==="palette"){prefSet("palette",b.dataset.v);applyTheme();render()}
});

/* ---------- events ---------- */
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.id==="plate-target"){plateOut();return}
  if(!t.dataset||!t.dataset.ex)return;const d=ensureDraft();const ex=t.dataset.ex;const en=d.entries[ex];const set=en.sets[+t.dataset.j];if(!set)return;set[t.dataset.f]=t.value.trim();saveDraft();
  const e=EXBY[ex];if(e.wu&&t.dataset.f==="kg"&&t.dataset.j==="0"){const el=$("wu-"+ex);if(el)el.innerHTML=wuHTML(e,workWeight(e,en))}});
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");
  if(!b){if(ev.target.dataset&&ev.target.dataset.scrim||ev.target.closest(".lightbox"))closeOverlay();return}
  const a=b.dataset.act;
  if(a==="goplan"){go("#plan")}
  else if(a==="pick"){S.draft.current=b.dataset.w;S.confirm=null;S.round={};saveDraft();render();window.scrollTo(0,0)}
  else if(a==="week"){const n=+b.dataset.n;S.draft.week=n===autoWeek()?null:n;const w=S.draft.current;if(!hasData(w))delete S.draft.workouts[w];saveDraft();render()}
  else if(a==="done"){audioInit();const d=ensureDraft();const ex=b.dataset.ex,j=+b.dataset.j;const e=EXBY[ex];const en=d.entries[ex];const set=en.sets[j];const row=$(`r-${ex}-${j}`);
    if(!set.done){const ik=$(`i-${ex}-${j}-kg`),ir=$(`i-${ex}-${j}-reps`);
      if(set.kg===""&&num(ik.placeholder)!=null){set.kg=ik.placeholder;ik.value=set.kg}
      if(set.reps===""&&num(ir.placeholder)!=null){set.reps=ir.placeholder;ir.value=set.reps}
      if(num(set.reps)==null){ir.focus();toast("Enter the reps first");return}
      set.done=true;row.classList.add("ok");if(!d.firstAt)d.firstAt=Date.now();
      const pr=prCheck(e,en,set);if(pr){set.pr=pr.t;set.prLabel=pr.label;row.classList.add("pr");toast(`New record: ${e.n}, ${pr.label}`)}
      startRest(e.rest);
    }else{set.done=false;delete set.pr;delete set.prLabel;row.classList.remove("ok","pr")}
    $("ex-"+ex).classList.toggle("done",en.sets.every(x=>x.done));
    saveDraft();
    const fin=document.querySelector('[data-act="finish"]');if(fin){const n=sessVolume({entries:d.entries}).n;fin.disabled=!n;fin.style.opacity=n?"":".5"}}
  else if(a==="hdone"){audioInit();const d=ensureDraft();const ex=b.dataset.ex,j=+b.dataset.j;const e=EXBY[ex];const en=d.entries[ex];const set=en.sets[j];
    if(set.done){set.done=false;delete set.pr;delete set.prLabel;if(e.k==="hold")set.reps=""}
    else{if(e.k==="reps"){const ir=$(`i-${ex}-${j}-reps`);if(set.reps===""&&num(ir.placeholder)!=null)set.reps=ir.placeholder;if(num(set.reps)==null){ir.focus();toast("Enter the reps first");return}}
      set.done=true;if(!d.firstAt)d.firstAt=Date.now();
      if(e.k==="reps"){const pr=prCheck(e,en,set);if(pr){set.pr=pr.t;set.prLabel=pr.label;toast(`New record: ${e.n}, ${pr.label}`)}}
      homeAfter(e,j)}
    saveDraft();render()}
  else if(a==="hold"){audioInit();startHold(b.dataset.ex,+b.dataset.j)}
  else if(a==="ho-minus"||a==="ho-plus"){const H=HT;if(!H||H.phase!=="ready")return;H.target=Math.max(5,Math.min(300,H.target+(a==="ho-plus"?5:-5)));const d=ensureDraft();d.entries[H.ex].t=H.target;saveDraft();hoPaint()}
  else if(a==="ho-pause"){const H=HT;if(!H||H.phase==="done")return;if(H.paused){H.end=Date.now()+H.rem;H.paused=false;b.textContent="Pause"}else{H.rem=H.end-Date.now();H.paused=true;b.textContent="Resume"}}
  else if(a==="ho-stop"){hoStop()}
  else if(a==="round"){S.round[b.dataset.sec]=+b.dataset.j;render()}
  else if(a==="addset"){const d=ensureDraft();d.entries[b.dataset.ex].sets.push({kg:"",reps:"",done:false});saveDraft();render()}
  else if(a==="plates"){openPlates(b.dataset.ex)}
  else if(a==="barpref"){prefSet("bar",b.dataset.v);b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",String(x===b)));plateOut()}
  else if(a==="close"){closeOverlay()}
  else if(a==="finish"){S.confirm="finish";render();setTimeout(()=>{const c=document.querySelector(".confirm");if(c)c.scrollIntoView({block:"center",behavior:"smooth"})},30)}
  else if(a==="cancel"){S.confirm=null;render()}
  else if(a==="finish-yes"){const w=S.draft.current;const d=S.draft.workouts[w];const entries={};const prs=[];

  return h+"</section>"}

/* ---------- v4: app updates (PWA) ---------- */
function updatesGroup(){if(HOST!=="pwa")return `<div class="group"><h2>App updates</h2><div class="srow"><div><b>Version ${APP_VERSION}</b><span class="muted small">Updates arrive automatically when the page is republished.</span></div></div></div>`;
  return `<div class="group"><h2>App updates</h2><div class="srow"><div><b>Check for app updates</b><span class="muted small">You have version ${APP_VERSION}. Checks your Netlify site for a newer one and installs it.</span></div><button class="btn" data-act="chkupd" id="chkupd">Check</button></div>
   <div class="srow"><div><b>Repair the app</b><span class="muted small">If the app looks out of date or won't load properly. Clears the saved app files, not your workouts.</span></div><a class="btn" href="repair.html" style="text-decoration:none;color:inherit">Repair</a></div></div>`}
async function checkUpdate(btn){btn.disabled=true;btn.textContent="Checking…";
  try{const r=await fetch("index.html?check="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const t=await r.text();const m=t.match(/APP_VERSION="([^"]+)"/);const v=m&&m[1];
    const reg="serviceWorker" in navigator?await navigator.serviceWorker.getRegistration():null;
    if(v&&v!==APP_VERSION){toast(`Version ${v} found. Updating…`);try{if(reg)await reg.update()}catch(e){}try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}setTimeout(()=>location.reload(),700);return}
    try{if(reg)reg.update()}catch(e){}toast(v?`You have the latest version (${APP_VERSION})`:"Couldn't read the version on your site")}
  catch(e){toast("Couldn't check for updates. Are you online?")}
  btn.disabled=false;btn.textContent="Check"}

/* ---------- v4: technique demo player ---------- */
const MUSN={quads:"Quads",glutes:"Glutes",hams:"Hamstrings",calves:"Calves",chest:"Chest",back:"Back",lowback:"Lower back",delts:"Shoulders",biceps:"Biceps",triceps:"Triceps",forearms:"Forearms",abs:"Abs"};
let DM=null;
function demoColors(){try{const cs=getComputedStyle(document.documentElement);const x=document.createElement("canvas").getContext("2d");x.fillStyle="#d9472e";x.fillStyle=cs.getPropertyValue("--accent").trim()||"#d9472e";const f=x.fillStyle;
  if(f[0]==="#"){DC.mus=[1,3,5].map(i=>parseInt(f.slice(i,i+2),16)).join(",")}else{const m=f.match(/[\d.]+/g);if(m)DC.mus=m.slice(0,3).join(",")}DC.bg=cs.getPropertyValue("--plate").trim()||"#fff"}catch(e){}}
function demoTotal(D){return D.seq.reduce((a,s)=>a+s[1],0)}
function demoStepOf(D,i){for(let k=i;k>=0;k--)if(D.seq[k][2])return k;return 0}
function openDemo(id){const D=DEMOS[id];if(!D)return;const e=EXBY[id];demoColors();if(DM)cancelAnimationFrame(DM.raf);
  const steps=D.seq.map((s,i)=>[i,s]).filter(x=>x[1][2]);const sp=String(S.dspeed||1);
  sheet((e?e.n:D.n)+" demo",`<div class="sheet-h"><div><div class="eyebrow">Technique demo</div><h2>${esc(e?e.n:D.n)}</h2></div><button class="btn sm" data-act="close">Close</button></div>
   <div class="demo-cv"><canvas id="demo-cv" width="720" height="480" role="img" aria-label="Animated figure showing ${esc(D.n)}, working muscles highlighted"></canvas><span class="demo-rep" id="demo-rep" aria-hidden="true"></span><span class="demo-tempo" id="demo-tp" aria-hidden="true"></span></div>
   <div class="demo-steps" role="group" aria-label="Steps">${steps.map(([i,s],k)=>`<button data-act="dstep" data-i="${i}" aria-pressed="false"><b>${k+1}</b><span>${esc(s[2])}</span></button>`).join("")}</div>
   <div class="demo-cue" id="demo-cue" aria-live="polite"></div>
   <div class="demo-ctl"><button class="btn primary" data-act="dplay" id="demo-play"></button>${seg("dspeed",sp,[["1","Real tempo"],["0.5","Slow motion"]],"dspeed")}</div>
   <div class="demo-meta"><div><span class="eyebrow">Tempo</span><b>${esc(D.tempo)}</b></div><div><span class="eyebrow">Muscles</span><span class="mchips">${D.mus.map(m=>`<span class="mchip p">${MUSN[m]}</span>`).join("")}${(D.mus2||[]).map(m=>`<span class="mchip s">${MUSN[m]}</span>`).join("")}</span></div></div>
   <div class="muted small">Highlighted muscles glow brighter as they work hardest. Solid chips are the main muscles; outlined chips help.${e&&e.c?" "+esc(e.c):""}</div>`,true);
  DM={id,D,t:0,last:null,playing:motionOn(),raf:0,cur:-1};
  if(!DM.playing)dmStep(steps.length?steps[0][0]:0);else{dmDraw();DM.raf=requestAnimationFrame(dmLoop)}
  dmBtn()}
function dmBtn(){const b=$("demo-play");if(b&&DM)b.textContent=DM.playing?"Pause":"Play"}
function dmLoop(ts){if(!DM)return;if(!$("demo-cv")){cancelAnimationFrame(DM.raf);DM=null;return}
  if(DM.last==null)DM.last=ts;const dt=Math.min(80,ts-DM.last);DM.last=ts;if(DM.playing)DM.t+=dt*(S.dspeed||1);dmDraw();if(DM.playing)DM.raf=requestAnimationFrame(dmLoop)}
function dmDraw(){const cv=$("demo-cv");if(!cv||!DM)return;const D=DM.D;const f=demoFrame(D,DM.t);demoRender(cv,D,f.pose,f.eff);
  const si=demoStepOf(D,f.i);if(si!==DM.cur){DM.cur=si;const s=D.seq[si];$("demo-cue").innerHTML=`<b>${esc(s[2])}</b> ${esc(s[3])}`;document.querySelectorAll('[data-act="dstep"]').forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.i===si)))}
  const rp=$("demo-rep");if(rp)rp.textContent=DM.playing?`Rep ${Math.floor(DM.t/demoTotal(D))+1}`:"";
  const tp=$("demo-tp");if(tp)tp.textContent=(S.dspeed||1)<1?"Slow motion":""}
function dmStep(i){if(!DM)return;const D=DM.D;DM.playing=false;cancelAnimationFrame(DM.raf);let acc=0;for(let k=0;k<=i;k++)acc+=D.seq[k][1];DM.t=acc-1;dmDraw();dmBtn()}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="demo"){ev.stopPropagation();openDemo(b.dataset.ex)}
  else if(a==="dplay"){if(!DM)return;DM.playing=!DM.playing;DM.last=null;if(DM.playing){const T=demoTotal(DM.D);if(DM.t%T>T-30)DM.t=Math.ceil(DM.t/T)*T;DM.raf=requestAnimationFrame(dmLoop)}else cancelAnimationFrame(DM.raf);dmBtn()}
  else if(a==="dstep"){dmStep(+b.dataset.i)}
  else if(a==="dspeed"){S.dspeed=+b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",String(x===b)));if(DM)dmDraw()}
  else if(a==="thm"){prefSet("theme",effDark()?"light":"dark");applyTheme();if(route()==="settings")render()}
  else if(a==="copylast"){const d=ensureDraft();const ex=b.dataset.ex;const en=d.entries[ex];const last=lastFor(ex);if(!en||!last)return;let n=0;
    en.sets.forEach((x,j)=>{if(x.done)return;const p=last.sets[j]||last.sets[last.sets.length-1];if(!p)return;x.kg=p.kg==null?"":String(p.kg);x.reps=p.reps==null?"":String(p.reps);n++});
    saveDraft();render();toast(`Copied ${n} set${n===1?"":"s"} from ${fmtD(last.date)}`);afterPaint(()=>{const c=$("ex-"+ex);if(c)replay(c,"glow")})}
  else if(a==="rest-pause"){if(rest.paused){rest.end=Date.now()+rest.rem;rest.paused=false}else{rest.rem=Math.max(0,rest.end-Date.now());rest.paused=true}tickRest()}
  else if(a==="restdays"){S.settings.restDays=+b.dataset.v;saveSettings();render()}
  else if(a==="chkupd"){checkUpdate(b)}
  else if(a==="ptab"){S.ptab=b.dataset.v;S.enterNext=true;render()}
  else if(a==="vdays"){S.vdays=+b.dataset.v;render()}
  else if(a==="gfilt"){S.gf=b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",String(x===b)));gApply();window.scrollTo({top:0,behavior:motionOn()?"smooth":"auto"})}
  else if(a==="mobrate"){S.mob=S.mob||{};const k=b.dataset.k;S.mob[k]=S.mob[k]===b.dataset.v?undefined:b.dataset.v;const y=scrollY;render();scrollTo(0,y)}
  else if(a==="mobsave"){const f=S.mob||{};const o={date:todayISO()};let any=false;["kL","kR"].forEach(k=>{const v=num(f[k]);if(v!=null&&v>=0&&v<40){o[k]=v;any=true}});["hip","oh"].forEach(k=>{const v=+f[k];if(v>=1&&v<=5){o[k]=v;any=true}});
    if(!any){toast("Enter at least one result first");return}S.settings.mobility=(S.settings.mobility||[]).filter(m=>m.date!==o.date).concat([o]);saveSettings();S.mob=null;render();toast("Mobility test saved")}
  else if(a==="mobdel"){S.confirm="mdel:"+b.dataset.d;render()}
  else if(a==="mobdel-yes"){S.settings.mobility=(S.settings.mobility||[]).filter(m=>m.date!==b.dataset.d);S.confirm=null;S.mob=null;saveSettings();render();toast("Test deleted")}
});

const MBY_M=Object.fromEntries(MACHINES.map(m=>[m.id,m]));
function aiCatalogue(){return MACHINES.map(m=>`${m.id}: ${m.n}${m.aka.length?" ("+m.aka.join(", ")+")":""}. Looks like: ${m.look}`).join("\n")}
function aiPrompt(){return `You identify gym equipment from a photo for a workout app.

Pick the machine from this list that best matches the photo. Use only these ids:
${aiCatalogue()}

Reply with JSON only, no other text:
{"id": "<best id, or null if nothing in the list matches or the photo isn't gym equipment>",
 "confidence": "high" | "medium" | "low",
 "alternatives": ["<up to 2 other plausible ids>"],
 "seen": "<one short sentence describing what is in the photo>"}

Rules: never invent an id that is not in the list. If the photo is unclear, too dark, or shows a person rather than equipment, set id to null and say why in "seen". Do not give exercise advice.`}

/* ---------- My Strength AI: scan, learn, add ---------- */
let SAMPLE=null;
(async()=>{if(HOST!=="claude"||!window.claude||!claude.use)return;try{const s=await claude.use("sample");if(s){let ok=true;try{const l=await s.limits();ok=!!(l&&l.images)}catch(e){}SAMPLE=ok?s:null}}catch(e){SAMPLE=null}if(/scan|settings/.test(route()))render()})();
const relayUrl=()=>(prefGet("relay")||"").trim();
function aiMode(){if(HOST==="claude")return SAMPLE?"claude":"manual";return relayUrl()?"relay":"manual"}
function deviceId(){let d=prefGet("device");if(!d){d=Math.random().toString(36).slice(2)+Date.now().toString(36);prefSet("device",d)}return d}
function aiRecent(){try{return JSON.parse(prefGet("recent")||"[]").filter(x=>MBY_M[x.id])}catch(e){return []}}
function aiAddRecent(id){const r=aiRecent().filter(x=>x.id!==id);r.unshift({id,d:todayISO()});prefSet("recent",JSON.stringify(r.slice(0,8)))}
const blobB64=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]);f.onerror=rej;f.readAsDataURL(b)});
async function aiShrink(file){const url=URL.createObjectURL(file);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const s=Math.min(1,1024/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));return {blob,preview:c.toDataURL("image/jpeg",.5)}}finally{URL.revokeObjectURL(url)}}
function aiClean(r){const ok=id=>typeof id==="string"&&MBY_M[id];const id=ok(r&&r.id)?r.id:null;
  const alts=[...new Set(((r&&r.alternatives)||[]).filter(x=>ok(x)&&x!==id))].slice(0,2);
  const conf=["high","medium","low"].includes(r&&r.confidence)?r.confidence:"low";return {id,conf:id?conf:"low",alts,seen:String((r&&r.seen)||"").slice(0,220)}}
function parseJSON(t){const m=String(t||"").match(/\{[\s\S]*\}/);if(!m)throw {code:"parse"};return JSON.parse(m[0])}
async function aiIdentify(blob,signal){const mode=aiMode();
  if(mode==="claude"){const {text}=await SAMPLE(aiPrompt(),{images:[blob],modelTier:"quick",cache:false,signal});return aiClean(parseJSON(text))}
  if(mode==="relay"){const res=await fetch(relayUrl(),{method:"POST",signal,headers:{"content-type":"application/json"},body:JSON.stringify({image:await blobB64(blob),media_type:"image/jpeg",device:deviceId()})});
    if(res.status===429)throw {code:"limit"};if(!res.ok)throw {code:"relay",status:res.status};return aiClean(await res.json())}
  throw {code:"manual"}}
async function aiScanFile(file){if(!file)return;S.mach=null;S.browse=false;
  try{const {blob,preview}=await aiShrink(file);S.scan={preview,status:aiMode()==="manual"?"manual":"busy"};render();window.scrollTo(0,0);
    if(S.scan.status==="manual")return;
    AI.ctl=new AbortController();const r=await aiIdentify(blob,AI.ctl.signal);if(!S.scan)return;S.scan.status="done";S.scan.res=r;if(r.id)aiAddRecent(r.id)}
  catch(e){if(!S.scan)return;if(e&&(e.name==="AbortError"||e.code==="aborted")){S.scan=null}else{S.scan.status="error";S.scan.err=e&&e.code||"error"}}
  AI.ctl=null;if(route()==="scan")render()}
const AI={ctl:null};
const ICON_CAM='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.5-2h5.6l1.5 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>';

function aiErrText(c){return c==="limit"?"You've reached today's scan limit. Choose the machine from the list instead.":c==="relay"?"The recognition service didn't answer. Check its address in Settings, or choose from the list.":c==="not_granted"?"Claude wasn't allowed to look at the photo. You can still choose the machine from the list.":c==="rate_limited"?"Too many scans at once. Wait a moment and try again.":"Something went wrong identifying the photo. Try again, or choose from the list."}
function modeNote(){const m=aiMode();return m==="claude"?"Your photo is sent to Claude to name the machine, then discarded. Nothing is stored, and each scan uses a little of your Claude usage.":m==="relay"?"Your photo is sent to your recognition service to name the machine, then discarded. Nothing is stored.":HOST==="claude"?"Automatic recognition isn't available in this view, so after taking a photo you'll pick the machine from the list.":"Automatic recognition isn't set up yet, so after taking a photo you'll pick the machine from the list. Set it up in Settings → Machine recognition."}
function mList(ids){return `<div class="mgrid">${ids.map(id=>{const m=MBY_M[id];return `<button class="mtile" data-act="ai-open" data-m="${id}"><span class="mt-i">${mImg(m)}</span><b>${esc(m.n)}</b>${m.ex.length||m.cardio?"":`<span class="muted small">Guide only</span>`}</button>`}).join("")}</div>`}
function viewScan(){const sc=S.scan;const mode=aiMode();
  let h=`<section class="view"><div class="stack" style="gap:6px"><div class="eyebrow">My Strength AI · Experimental</div><h1>Scan a machine</h1><div class="muted">Photograph a gym machine. The app suggests what it is, shows you how to set it up and use it, and adds it to today's workout.</div></div>`;
  const pick=`<input type="file" id="ai-cam" accept="image/*" capture="environment" hidden><input type="file" id="ai-lib" accept="image/*" hidden>`;
  if(!sc){h+=`<div class="scanhero">${pick}<label class="btn primary big scanbtn" for="ai-cam">${ICON_CAM}<span>Take a photo</span></label>

     <div class="muted small" style="text-align:center">${esc(modeNote())}</div></div>
     <div class="tipcard"><b>For the best result</b><span class="small">Stand back so the whole machine is in the photo, including the seat, pads and weight stack. Avoid photographing other people.</span></div>`}
  else{h+=`<div class="scanres"><div class="shot"><img src="${sc.preview}" alt="Your photo">${sc.status==="busy"?`<div class="shot-busy"><span class="spin" aria-hidden="true"></span><b>Identifying…</b><button class="btn sm" data-act="ai-stop">Stop</button></div>`:""}</div>`;
    if(sc.status==="done"){const r=sc.res;const m=r.id&&MBY_M[r.id];
      if(m){h+=`<div class="match"><div class="match-h"><span class="mt-i sm">${mImg(m)}</span><div><span class="eyebrow">Looks like</span><h2>${esc(m.n)}</h2><span class="conf ${r.conf}">${confLabel(r.conf)}</span></div></div>
        ${r.seen?`<p class="muted small seen">“${esc(r.seen)}”</p>`:""}
        ${r.conf==="low"?`<p class="small warnline">I'm not confident about this one. A second photo from further back, showing the whole machine, usually helps.</p>`:""}
        <button class="btn primary big" data-act="ai-open" data-m="${m.id}">Yes, show me how to use it</button>
        ${r.alts.length?`<div class="alts"><span class="muted small">Or is it…</span>${r.alts.map(a=>`<button class="btn sm" data-act="ai-open" data-m="${a}">${esc(MBY_M[a].n)}</button>`).join("")}</div>`:""}</div>`}
      else h+=`<div class="match"><h2>I couldn't match this to a machine I know</h2>${r.seen?`<p class="muted small seen">“${esc(r.seen)}”</p>`:""}<p class="small">Try a photo from further back in good light, or pick the machine yourself.</p>${r.alts.length?`<div class="alts"><span class="muted small">It might be…</span>${r.alts.map(a=>`<button class="btn sm" data-act="ai-open" data-m="${a}">${esc(MBY_M[a].n)}</button>`).join("")}</div>`:""}</div>`}
    else if(sc.status==="error")h+=`<div class="match"><h2>Couldn't identify it</h2><p class="small">${esc(aiErrText(sc.err))}</p></div>`;
    else if(sc.status==="manual")h+=`<div class="match"><h2>Which machine is it?</h2><p class="small muted">${esc(modeNote())}</p></div>`;
    h+=`<div class="row" style="justify-content:center">${pick}<label class="btn" for="ai-cam">${sc.status==="done"&&sc.res&&sc.res.conf!=="high"?"Take a second photo":"Scan another"}</label><button class="btn" data-act="ai-browse">${sc.status==="manual"?"Show all machines":"None of these — choose from the list"}</button></div></div>`;
    if(sc.status==="manual")S.browse=true}
  if(S.browse){const inPlan=MACHINES.filter(m=>m.ex.length||m.cardio).map(m=>m.id),other=MACHINES.filter(m=>!m.ex.length&&!m.cardio).map(m=>m.id);
    h+=`<div class="sec-h" id="ai-list"><div><h2>Machines in your plan</h2><span class="muted small">Tap one to learn it and add it to today</span></div></div>${mList(inPlan)}
     <div class="sec-h"><div><h2>Other common machines</h2><span class="muted small">Setup and technique guides; not in your exercise library yet</span></div></div>${mList(other)}`}
  const rec=aiRecent();if(rec.length&&!S.browse)h+=`<div class="sec-h"><div><h2>Recently scanned</h2></div></div>${mList(rec.map(x=>x.id))}`;
  return h+`<div class="note small"><span>ⓘ</span><span>Experimental. Suggestions can be wrong, so always check the name matches the machine in front of you. Setup and technique guidance is written and reviewed in advance, never made up by the AI.</span></div></section>`}
function inToday(id){const d=S.draft&&S.draft.workouts&&S.draft.workouts[S.draft.current];const w=S.draft&&wdef(S.draft.current);return !!(w&&(w.ex.some(e=>e.id===id)||(d&&(d.extra||[]).includes(id))))}
function musRow(ids,cls){return ids.filter(g=>MBY[g]).map(g=>`<span class="mchip ${cls}">${esc(MBY[g].n)}</span>`).join("")}
function viewMachine(){const m=MBY_M[S.mach];if(!m){S.mach=null;return viewScan()}
  const exs=m.ex.map(id=>EXBY[id]).filter(Boolean);const main=[...new Set(exs.length?exs.flatMap(e=>e.g||[]):m.g||[])],help=[...new Set(exs.length?exs.flatMap(e=>e.g2||[]):m.g2||[])].filter(g=>!main.includes(g));
  const cur=wdef((S.draft&&S.draft.current)||nextWorkout());
  let h=`<section class="view"><button class="btn ghost sm backbtn" data-act="ai-back">‹ Back</button><div class="stack" style="gap:6px"><div class="eyebrow">Machine guide <span class="rvw">✓ Reviewed</span></div><h1>${esc(m.n)}</h1>${m.aka.length?`<div class="muted">Also called ${esc(m.aka.join(", "))}</div>`:""}</div>`;
  if(m.img)h+=`<button class="plate" style="aspect-ratio:16/9" data-act="zoom" data-ex="${m.img===IMGKEY[m.ex[0]]?m.ex[0]:m.img}" aria-label="Enlarge illustration"><img src="${img(m.img)}" alt="${esc(m.n)}"></button>`;
  const dm=m.ex.find(id=>DEMOS[id]);if(dm)h+=`<button class="btn demo-b" data-act="demo" data-ex="${dm}"><span aria-hidden="true">▶</span> Watch the technique demo <span class="muted small">${esc(EXBY[dm].n)}</span></button>`;
  h+=`<div class="group mg"><h2>1 · Set it up</h2><ol class="steps">${m.set.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;

      <p class="small">${esc(e.c)}</p>${DEMOS[e.id]?`<ol class="steps sm">${DEMOS[e.id].seq.filter(s=>s[2]).map(s=>`<li><b>${esc(s[2])}.</b> ${esc(s[3])}</li>`).join("")}</ol><div class="muted small">Tempo: ${esc(DEMOS[e.id].tempo)}</div>`:""}
      <button class="btn ${on?"":"primary"} addbtn" data-act="ai-add" data-ex="${e.id}" ${on?"disabled":""}>${on?`✓ In today's workout`:`+ Add to today's workout`}</button></div>`}).join("")}
     <div class="muted small">Adds to <b>${esc(cur.name)}</b>, the workout open on your Today tab.</div></div>`}
  else if(m.cardio)h+=`<div class="group mg"><h2>2 · Use it</h2><p class="small">Log your minutes in the Cardio card at the bottom of today's workout.</p><button class="btn primary" data-act="ai-cardio">Log minutes on Today</button></div>`;
