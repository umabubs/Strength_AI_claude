<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Strength AI</title>
<meta name="description" content="Experimental: photograph a gym machine, learn how to set it up and use it, and add it to your workout. Built on Strength Log.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strength AI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column, sticky header, fixed tab bar; white plates behind illustrations. */
:root{
  --bg:#f3f3f0; --surface:#ffffff; --sunk:#e9e9e4; --line:#d9d8d1;
  --fg:#1d1f22; --muted:#676a6f; --accent:#d4442a; --accent-ink:#ffffff; --accent-soft:#f9e1da;
  --good:#2f7d4f; --good-soft:#dcefe2; --plate:#ffffff; --scrim:rgba(10,10,12,.6);
  --wa:#d4442a; --wb:#2d6bcf; --wc:#7a4bcf; --wd:#23845a; --wx:#b36b00; --hl2:color-mix(in srgb,var(--accent) 38%,var(--line));
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131416; --surface:#1c1e21; --sunk:#25282c; --line:#33363b;
  --fg:#ececea; --muted:#9a9da3; --accent:#ef6a4f; --accent-ink:#1a0d09; --accent-soft:#3a201a;
  --good:#5cc489; --good-soft:#1b3326; --plate:#f4f4f2; --scrim:rgba(0,0,0,.7);
  --wa:#dc5a3f; --wb:#4a84e4; --wc:#9070dd; --wd:#36a06f; --wx:#c98714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1c1e21; --sunk:#25282c; --line:#33363b;
  --fg:#ececea; --muted:#9a9da3; --accent:#ef6a4f; --accent-ink:#1a0d09; --accent-soft:#3a201a;
  --good:#5cc489; --good-soft:#1b3326; --plate:#f4f4f2; --scrim:rgba(0,0,0,.7);
  --wa:#dc5a3f; --wb:#4a84e4; --wc:#9070dd; --wd:#36a06f; --wx:#c98714; color-scheme:dark}
:root[data-palette="ocean"]{--bg:#edf2f6;--surface:#ffffff;--sunk:#e0e8ee;--line:#cbd8e1;--fg:#14212b;--muted:#5b6c78;--accent:#1d6fb8;--accent-ink:#ffffff;--accent-soft:#dbe9f6;}
:root[data-palette="forest"]{--bg:#eef2ec;--surface:#ffffff;--sunk:#e1e8dd;--line:#ccd8c7;--fg:#18221a;--muted:#5c6b5d;--accent:#3b7a35;--accent-ink:#ffffff;--accent-soft:#dfeedb;--good:#1f7a8c;--good-soft:#d6eef2;}
:root[data-palette="plum"]{--bg:#f4f0f6;--surface:#ffffff;--sunk:#e9e1ed;--line:#dacde0;--fg:#22172a;--muted:#6c5d74;--accent:#8a3ca6;--accent-ink:#ffffff;--accent-soft:#efdff6;}
:root[data-palette="sand"]{--bg:#f5efe4;--surface:#fffcf6;--sunk:#ebe2d1;--line:#dccfb8;--fg:#2a2117;--muted:#786a56;--accent:#b0621b;--accent-ink:#ffffff;--accent-soft:#f4e2cc;}
:root[data-palette="rose"]{--bg:#f7eff1;--surface:#ffffff;--sunk:#eee2e5;--line:#e0cfd4;--fg:#2a171c;--muted:#765c63;--accent:#c2185b;--accent-ink:#ffffff;--accent-soft:#f8dde7;}
@media (prefers-color-scheme: dark){:root[data-palette="ocean"]:not([data-theme="light"]){--bg:#0e161c;--surface:#16212a;--sunk:#1e2b35;--line:#2b3a46;--fg:#e5edf3;--muted:#91a3b0;--accent:#5ea8e8;--accent-ink:#07131d;--accent-soft:#15304a;}}
:root[data-palette="ocean"][data-theme="dark"]{--bg:#0e161c;--surface:#16212a;--sunk:#1e2b35;--line:#2b3a46;--fg:#e5edf3;--muted:#91a3b0;--accent:#5ea8e8;--accent-ink:#07131d;--accent-soft:#15304a;}
@media (prefers-color-scheme: dark){:root[data-palette="forest"]:not([data-theme="light"]){--bg:#101611;--surface:#182019;--sunk:#212b22;--line:#2e3a2f;--fg:#e6ede5;--muted:#94a394;--accent:#7fc472;--accent-ink:#0b1609;--accent-soft:#1e3520;--good:#56b8c8;--good-soft:#15333a;}}
:root[data-palette="forest"][data-theme="dark"]{--bg:#101611;--surface:#182019;--sunk:#212b22;--line:#2e3a2f;--fg:#e6ede5;--muted:#94a394;--accent:#7fc472;--accent-ink:#0b1609;--accent-soft:#1e3520;--good:#56b8c8;--good-soft:#15333a;}
@media (prefers-color-scheme: dark){:root[data-palette="plum"]:not([data-theme="light"]){--bg:#151017;--surface:#1e1721;--sunk:#281f2c;--line:#382c3e;--fg:#eee6f2;--muted:#a495aa;--accent:#c88ae0;--accent-ink:#1a0a21;--accent-soft:#382143;}}
:root[data-palette="plum"][data-theme="dark"]{--bg:#151017;--surface:#1e1721;--sunk:#281f2c;--line:#382c3e;--fg:#eee6f2;--muted:#a495aa;--accent:#c88ae0;--accent-ink:#1a0a21;--accent-soft:#382143;}
@media (prefers-color-scheme: dark){:root[data-palette="sand"]:not([data-theme="light"]){--bg:#16120d;--surface:#1f1a13;--sunk:#29231a;--line:#393024;--fg:#f0e8db;--muted:#a89a85;--accent:#e39d55;--accent-ink:#1d1004;--accent-soft:#3c2916;}}
:root[data-palette="sand"][data-theme="dark"]{--bg:#16120d;--surface:#1f1a13;--sunk:#29231a;--line:#393024;--fg:#f0e8db;--muted:#a89a85;--accent:#e39d55;--accent-ink:#1d1004;--accent-soft:#3c2916;}
@media (prefers-color-scheme: dark){:root[data-palette="rose"]:not([data-theme="light"]){--bg:#170f12;--surface:#21171a;--sunk:#2b1f23;--line:#3d2c31;--fg:#f3e6ea;--muted:#ab949b;--accent:#f06292;--accent-ink:#22060f;--accent-soft:#42202d;}}
:root[data-palette="rose"][data-theme="dark"]{--bg:#170f12;--surface:#21171a;--sunk:#2b1f23;--line:#3d2c31;--fg:#f3e6ea;--muted:#ab949b;--accent:#f06292;--accent-ink:#22060f;--accent-soft:#42202d;}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--fg);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font:700 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand b{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);text-align:right}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 40px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
h2{font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
h3{font:600 20px/1.15 var(--display)}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
section.view{padding-top:18px;display:flex;flex-direction:column;gap:16px}

.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px 7px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.pill .k{font:700 22px/1 var(--display)}
.pill .t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill[aria-pressed="true"] .t{color:inherit;opacity:.75}
.pill .next{font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}

.weekbar{display:flex;gap:10px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.weekdots{display:flex;gap:4px;align-items:center}
.weekdots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font:700 15px/1 var(--display)}
.weekdots button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.weekbar .txt{min-width:0;display:flex;flex-direction:column;justify-content:center;font-size:13px;line-height:1.3}
.weekbar .txt b{font-family:var(--display);font-size:15px;letter-spacing:.02em}

.note{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.calm{background:var(--sunk)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex.done{border-color:var(--good)}
.ex-head{display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px;padding:12px;align-items:center}
.plate{background:var(--plate);border-radius:8px;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;max-width:100%;overflow:hidden;border:0;padding:4px}
.plate img{width:100%;height:100%;object-fit:contain;display:block}
.ex-meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.ex-meta .tgt{font:600 15px/1 var(--display);color:var(--accent);letter-spacing:.03em}
.ex-meta .mus{font-size:13px;color:var(--muted)}
.ex-meta .last{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;background:var(--sunk);color:var(--muted);border-radius:5px;padding:4px 6px;vertical-align:2px;margin-left:4px}
.sug{margin:0 12px 10px;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.sug b{font:700 17px/1 var(--display);letter-spacing:.02em;white-space:nowrap}
.sug.up{background:var(--good-soft)}
.sug.up b{color:var(--good)}
.sets{border-top:1px solid var(--line);padding:6px 12px 10px}
.sets table{width:100%;border-collapse:collapse}
.sets th{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 4px}
.sets td{padding:4px}
.sets td.n{width:44px;font:700 17px/1 var(--display);color:var(--muted)}
tr.pr td.n::after{content:"PR";display:block;font:700 11px/1.3 var(--body);color:var(--accent);letter-spacing:.06em}
.sets input,.hin{width:100%;min-width:0;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);padding:0 10px;font:600 20px/1 var(--display);font-variant-numeric:tabular-nums;text-align:center}
.sets input::placeholder,.hin::placeholder{color:var(--muted);opacity:.55}
.sets td.ck{width:52px}
.tick{width:44px;height:44px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.tick svg{width:20px;height:20px;stroke:var(--muted)}
tr.ok .tick,.tick.on{background:var(--good);border-color:var(--good)}
tr.ok .tick svg,.tick.on svg{stroke:var(--surface)}
tr.ok input{background:var(--good-soft);border-color:transparent}
.cue{font-size:13px;color:var(--muted);padding:2px 4px 0}
.tools{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding-top:6px}
.wu{font-size:13px;color:var(--muted);padding:2px 4px;flex:1 1 180px;min-width:0}
.wu b{color:var(--fg);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
.chip{background:var(--sunk);border-radius:6px;padding:3px 8px;font:600 14px/1.3 var(--display);font-variant-numeric:tabular-nums;color:var(--fg)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:15px;font:700 20px/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 10px;font-size:14px}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.confirm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}

/* home day */
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:8px;flex-wrap:wrap}
.sec-h>div:first-child{min-width:0;display:flex;flex-direction:column;gap:2px}
.rounds{display:flex;gap:4px;align-items:center}
.rounds span{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.rounds button{min-width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:700 16px/1 var(--display)}
.rounds button.fin{background:var(--good-soft);border-color:transparent;color:var(--good)}
.rounds button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hrows{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;align-items:center}
.hrow.done{border-color:var(--good)}
.hrow h3{font-size:18px}
.hrow .tgt{font:600 15px/1.2 var(--display);color:var(--accent);letter-spacing:.03em}
.hrow .mus{font-size:12.5px;color:var(--muted)}
.hact{display:flex;gap:6px;align-items:center}
.hin{width:62px}
.hrow.done .hin{background:var(--good-soft);border-color:transparent}
.held{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--good);white-space:nowrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font:600 11px/1 var(--body);letter-spacing:.03em}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}

.rest{position:fixed;left:0;right:0;z-index:7;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.rest .in{max-width:528px;margin:0 auto 8px;background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.rest .lbl{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.rest .t{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;flex:1}
.rest button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:7px 10px;font-weight:600;font-size:14px;opacity:.9}
.rest.over .in{background:var(--good);color:var(--surface)}

/* hold timer */
.holdov{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.hold-in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.hold-in .plate{width:190px;aspect-ratio:16/9}
.ho-phase{font:700 22px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.holdov.hold .ho-phase{color:var(--accent)}
.ring{position:relative;width:min(72vw,300px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .rbg{stroke:var(--sunk)}
.ring .rfg{stroke:var(--muted);stroke-linecap:round}
.holdov.hold .ring .rfg{stroke:var(--accent)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ho-num{font:700 clamp(84px,30vw,128px)/0.9 var(--display);font-variant-numeric:tabular-nums}
.ho-sub{font-size:15px;color:var(--muted)}
.ho-adj{display:flex;gap:10px;align-items:center;min-height:42px}
.ho-adj b{font:700 20px/1 var(--display);min-width:92px}
.hold-in .ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.hold-in .ctl .btn{padding:14px;font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.05em}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.scrim.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.field label{font-weight:600}
.field input{width:120px;height:46px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);padding:0 10px;font:600 22px/1 var(--display);text-align:center}
.barviz{display:flex;align-items:center;justify-content:center;gap:3px;min-height:112px;background:var(--sunk);border-radius:10px;padding:10px;overflow-x:auto}
.barviz .rod{width:46px;height:8px;background:var(--muted);border-radius:2px;flex:none}
.barviz .collar{width:8px;height:22px;background:var(--muted);border-radius:2px;flex:none}
.barviz .pl{flex:none;border-radius:4px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--display);writing-mode:vertical-rl}
.pout{font:700 24px/1.15 var(--display);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px 8px;text-align:center}
.stat b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.prlist{display:flex;flex-direction:column;gap:6px}
.prlist div{display:flex;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:14.5px}
.prlist b{font-family:var(--display);font-size:17px;white-space:nowrap}
.prbadge{display:inline-block;font:700 11px/1 var(--body);letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:3px 5px;vertical-align:1px}

/* guide */
.wk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:6px}
.guide-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.guide-card .plate{aspect-ratio:16/9}
.guide-card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.guide-card dt{font:600 12px/1.6 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.guide-card dd{margin:0}
.jump{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.jump a{flex:none;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}

/* progress */
.lift{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.lift-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lift-top .big{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.lift-top .big small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.delta{font:600 13px/1 var(--body);color:var(--good)}
.delta.neg{color:var(--accent)}
svg.spark{width:100%;height:84px;display:block;overflow:visible}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);font-size:15px}

/* history */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sess>button{width:100%;background:transparent;border:0;text-align:left;padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.datebox{width:48px;text-align:center;border-radius:8px;background:var(--sunk);padding:6px 0}
.datebox .d{font:700 22px/1 var(--display)}
.datebox .m{font:600 11px/1.2 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sess .detail{border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.sess .detail .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.sess .detail .line span:last-child{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:15px;text-align:right}

/* settings */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 6px;display:flex;flex-direction:column}
.group h2{font-size:17px;color:var(--muted);letter-spacing:.08em;padding-bottom:4px}
.srow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.group h2+.srow{border-top:0}
.srow>div:first-child{min-width:0;flex:1 1 200px;display:flex;flex-direction:column;gap:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.dot.ok{background:var(--good)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.lightbox .plate{width:100%;max-width:560px;aspect-ratio:auto;padding:12px}
.lightbox .plate img{height:auto}

/* v3: pills, plan, custom, groups, calendar, palettes */
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{position:relative;overflow:hidden;flex:1 0 74px;min-width:0;padding-top:11px}
.pill .t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.wbar{position:absolute;left:0;right:0;top:0;height:4px}
.planrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.planrow span{min-width:0;flex:1 1 180px}
.krows{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.krow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center}
.krow .n{font:700 17px/1 var(--display);color:var(--muted)}
.krow .kl{font-size:14px;color:var(--muted);min-width:0}
.krow.ok .hin{background:var(--good-soft);border-color:transparent}
.slot,.cust{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.slot{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center}
.slot h3{font-size:18px}
.lt{width:36px;height:36px;border-radius:9px;color:#fff;font:700 20px/36px var(--display);text-align:center}
.cust{display:flex;flex-direction:column;gap:10px}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.thumbs .plate{aspect-ratio:4/3;padding:2px}
.slotbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slotbtns .btn{text-align:left;font-weight:500}
.slotbtns .btn b{font:700 18px/1 var(--display);margin-right:4px}
.tin{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font:600 20px/1 var(--display)}
.bsel{display:flex;flex-direction:column;gap:8px}
.bitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px}
.bitem .plate{aspect-ratio:4/3;padding:2px;align-self:start}
.bitem h3{font-size:17px;min-width:0}
.bctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bctl input{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);padding:0 6px;font:600 17px/1 var(--display);text-align:center}
.bctl .sn{width:50px}
.bctl .rt{width:92px}
.bctl label{font:600 11px/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.iconbtn{width:36px;height:36px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn:disabled{opacity:.35}
.bfilter{display:flex;gap:8px;flex-wrap:wrap}
.bfilter input,.bfilter select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font:500 16px var(--body);min-width:0}
.bfilter input{flex:1 1 150px}
.bfilter select{flex:1 1 150px}
.addbtn{min-width:76px}
.addbtn[aria-pressed="true"]{background:var(--good-soft);border-color:transparent;color:var(--good)}
.sticky-save{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:8px;background:var(--bg);padding-block:10px 6px;border-top:1px solid var(--line)}
.btn:disabled{opacity:.5}

.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.gtile h3{font-size:19px}
.gtile .muted{font-size:12.5px;line-height:1.3}
.gtile .plate{aspect-ratio:16/10;margin-bottom:4px}
svg.body{display:block;width:100%;height:auto;max-width:100%}
.gtile svg.body{max-height:150px;margin:0 auto 4px}
svg.body .lbl{font:600 11px var(--body);fill:var(--muted);letter-spacing:.1em}
.ghero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:14px;align-items:center}
.exrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;color:var(--fg)}
.exrow .plate{aspect-ratio:4/3;padding:2px}
.exrow h3{font-size:17px}
.exrow .mus{font-size:12.5px;color:var(--muted)}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.wb{font:700 11px/1 var(--body);border-radius:5px;padding:3px 6px;color:#fff;letter-spacing:.04em;white-space:nowrap}
.wb.lib{background:var(--sunk);color:var(--muted)}
.tchip{font:600 10.5px/1 var(--body);border-radius:5px;padding:3px 6px;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
dl.mini{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13.5px}
dl.mini dt{font:600 11px/1.7 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dl.mini dd{margin:0}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal-h h2{font-size:22px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-dow{font:600 11px/1 var(--body);color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.cday{aspect-ratio:1/1.15;border:0;background:var(--sunk);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 2px;min-width:0;color:var(--fg)}
.cday.out{background:transparent}
.cday .dn{font:600 14px/1 var(--display);font-variant-numeric:tabular-nums}
.cday.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cday[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.cday .w{display:block;min-width:20px;max-width:100%;height:17px;border-radius:5px;color:#fff;font:700 12px/17px var(--display);padding:0 3px;overflow:hidden;text-align:center}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1 1 100%}
.sw{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0;color:var(--fg)}
.sw[aria-checked="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw i{width:24px;height:24px;border-radius:50%;flex:none;border:1px solid rgba(127,127,127,.35)}
nav.tabs .in{grid-template-columns:repeat(6,1fr)}
nav.tabs a{font-size:10.5px;letter-spacing:.01em}

/* v3.1 motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes zoomin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes popin{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes ripple{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}to{box-shadow:0 0 0 14px transparent}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 45%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes restin{from{transform:translateY(130%)}to{transform:none}}
@keyframes restout{to{transform:translateY(130%);opacity:0}}
@keyframes restdone{0%,100%{transform:none}30%{transform:scale(1.03)}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:none}}
@keyframes mpulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes tabpop{0%{transform:translateY(0)}40%{transform:translateY(-4px)}100%{transform:none}}
.rise{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.popin{animation:popin .4s cubic-bezier(.3,1.4,.5,1) both}
.tick.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1),ripple .6s ease-out}
.ex.glow,.hrow.glow{animation:glow .9s ease-out}
tr.pr.justpr td.n::after{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.toast{animation:toastin .28s cubic-bezier(.2,.8,.3,1)}
.scrim{animation:fadein .2s ease-out}
.sheet{animation:sheetup .34s cubic-bezier(.2,.9,.3,1)}
.lightbox .plate{animation:zoomin .25s cubic-bezier(.2,.8,.3,1)}
.scrim.still,.scrim.still .sheet{animation:none}
.rest .in{animation:restin .32s cubic-bezier(.2,.9,.3,1) both;position:relative;overflow:hidden}
.rest.out .in{animation:restout .22s ease-in forwards}
.rest.over .in{animation:restdone .6s ease-in-out 2}
.rbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:color-mix(in srgb,currentColor 18%,transparent)}
.rbar i{display:block;height:100%;background:currentColor;opacity:.75;transform-origin:left;transition:transform .2s linear}
.holdov{animation:fadein .2s ease-out}
.hold-in{animation:zoomin .3s cubic-bezier(.2,.8,.3,1)}
#ho-ring{transition:stroke-dashoffset .12s linear}
.ho-num.tickpop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.holdov.hold:not(.done) .ring{animation:breathe 3.2s ease-in-out infinite}
.holdov.done .ring .rfg{stroke:var(--good)}
.holdov.done .ho-num{color:var(--good);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.holdov.done .ho-phase{color:var(--good)}
.holdov.done .ctl{visibility:hidden}
svg.spark.draw{animation:reveal .9s .1s cubic-bezier(.3,.7,.3,1) both}
.vbar.grow{animation:growup .55s cubic-bezier(.2,.8,.3,1) both;transform-origin:bottom}
svg.body.live .hi{animation:mpulse 2.2s ease-in-out infinite}
#tabs.enter a[aria-current="page"] svg{animation:tabpop .35s ease-out}
.prlist div{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.prlist div:nth-child(2){animation-delay:.08s}.prlist div:nth-child(3){animation-delay:.16s}.prlist div:nth-child(n+4){animation-delay:.24s}
:is(.btn,.tick,.pill,.gtile,.exrow,.cday,.iconbtn,.sw,.plate,nav.tabs a,.weekdots button,.rounds button,.seg button){transition:transform .12s ease,background-color .2s,border-color .2s,color .2s}
:is(.btn,.tick,.pill,.gtile,.exrow,.cday,.iconbtn,.sw,.weekdots button,.rounds button):active:not(:disabled){transform:scale(.96)}
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{animation:none!important;transition:none!important}

@media (prefers-reduced-motion: no-preference){.ex,.pill,.tick,.hrow{transition:border-color .2s,background-color .2s}}
/* ---------- v4 ---------- */
header.top{align-items:center}
.hdr-r{display:flex;align-items:center;gap:10px;min-width:0}
.thm{width:34px;height:34px;border-radius:50%}
.thm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.thm svg path:only-child{fill:currentColor;stroke:none}

/* status + schedule */
.status{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.st-top{display:flex;gap:10px;align-items:flex-start}
.st-top>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.st-top b{font:700 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.st-dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:3px;background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.status.rest .st-dot{background:var(--muted);box-shadow:0 0 0 4px var(--sunk)}
.upc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.upc .u{background:var(--sunk);border-radius:9px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;overflow:hidden;min-width:0}
.upc .u i{position:absolute;left:0;right:0;top:0;height:3px}
.upc .u b{font:700 20px/1 var(--display)}
.upc .u span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.upc .u em{font-style:normal;font-size:11px;color:var(--muted)}
.upc .u.now{background:var(--good-soft)}
.upc .u.now span{color:var(--good)}

/* cardio and notes */
.cardio{padding:12px;display:flex;flex-direction:column;gap:10px}
.cx-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cx-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center}
.cx-row>div{display:flex;flex-direction:column;gap:1px}
.cx-row .plate{padding:2px}
.cx-in{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.cx-in input,.mob2 input{width:68px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);text-align:center;font:600 20px/1 var(--display)}
.cx-notes{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.cx-notes label{display:flex;flex-direction:column;gap:2px}
.cx-notes textarea{width:100%;border-radius:9px;border:1px solid var(--line);background:var(--sunk);padding:10px;font:15px/1.4 var(--body);color:var(--fg);resize:vertical;min-height:72px}
.snote{background:var(--sunk);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.snote p{margin:0;white-space:pre-wrap;font-size:14px}

/* keypad */
.kp{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.16);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.kp-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.kp-h{display:flex;align-items:center;gap:10px;min-height:34px}
.kp-l{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-v{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.kp-v.ph{color:var(--muted);opacity:.6}
.kp-x{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:16px;padding:6px 4px 6px 8px}
.kp-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp-g button,.kp-f button{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font:600 27px/1 var(--display);display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kp-g button:active,.kp-f button:active{background:var(--line)}
.kp-g svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.kp-f{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}
.kp-f button{font-size:20px;height:46px}
.kp-f .kp-n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
input.kp-on{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)!important}
body.kp-open .wrap{padding-bottom:360px}
body.kp-open .rest{display:none}
.kpup{animation:kpup .26s cubic-bezier(.2,.9,.3,1)}
.kpdown{animation:kpdown .18s ease-in forwards}
@keyframes kpup{from{transform:translateY(100%)}to{transform:none}}
@keyframes kpdown{to{transform:translateY(100%)}}

/* rest timer with pause */
.rest .in{gap:8px}
.rest button[hidden]{display:none}

/* guide search */
.gtools{display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:4;background:var(--bg);padding:6px 0 8px;margin:-6px 0 -8px}
.gsearch{position:relative}

.gfilt::-webkit-scrollbar{display:none}

.gfilt button[aria-checked="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.guide-card[hidden],[data-wh][hidden],.gsub[hidden]{display:none!important}
.demo-b{display:flex;align-items:center;gap:8px;justify-content:flex-start;text-align:left;background:var(--accent-soft);border-color:transparent;flex-wrap:wrap}

.ptabs .seg{display:flex;width:100%}
.ptabs .seg button{flex:1;padding-inline:4px}
.mv{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;padding:3px 0}
.mv .mn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb{height:12px;background:var(--sunk);border-radius:6px;display:flex;overflow:hidden}
.mb i{display:block;height:100%}
.mb i.p,.mkey i.p{background:var(--accent)}
.mb i.s,.mkey i.s{background:var(--hl2)}
.mv .mt{font-size:17px;font-weight:600;text-align:right;min-width:40px}
.mv .mt small{font:500 12px var(--body);color:var(--muted)}
.mkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-top:6px}
.mkey span{display:flex;align-items:center;gap:5px}
.mkey i{width:12px;height:12px;border-radius:3px;display:inline-block}
[data-motion="on"] .mb i{animation:mbgrow .7s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}
@keyframes mbgrow{from{transform:scaleX(0)}}
.recs{display:flex;flex-direction:column;gap:6px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rec-n{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rec-n b{font:600 18px/1.15 var(--display)}
.rec-v{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec-v>div{display:flex;flex-direction:column;gap:1px;background:var(--sunk);border-radius:8px;padding:7px 9px}
.big2{font:700 24px/1 var(--display)}
.big2 small{font-size:14px;color:var(--muted)}
.srow.col{flex-direction:column;align-items:stretch}
.mob2{display:flex;gap:10px}
.mob2 label{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font:700 20px/1 var(--display)}
.rate button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rate-t{min-height:1.4em}
.mobcards{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mrow>span.small{flex:1;min-width:180px}

/* demo player */
.demo-cv{position:relative;background:var(--plate);border-radius:12px;overflow:hidden}
.demo-cv canvas{display:block;width:100%;height:auto;aspect-ratio:3/2}
.demo-rep,.demo-tempo{position:absolute;top:8px;font:700 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#5c6168;background:rgba(255,255,255,.85);border-radius:6px;padding:5px 7px}
.demo-rep{left:8px}.demo-tempo{right:8px}
.demo-rep:empty,.demo-tempo:empty{display:none}
.demo-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.demo-steps button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:13.5px;line-height:1.15}
.demo-steps button b{font:700 16px/1 var(--display);width:24px;height:24px;border-radius:50%;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center}
.demo-steps button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.demo-steps button[aria-pressed="true"] b{background:var(--accent);color:var(--accent-ink)}
.demo-cue{min-height:2.9em;font-size:15px}
.demo-cue b{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em;margin-right:4px;color:var(--accent)}
.demo-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-ctl .btn{min-width:96px}
.demo-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:start;background:var(--sunk);border-radius:10px;padding:10px 12px}
.demo-meta>div{display:flex;flex-direction:column;gap:5px}
.mchips{display:flex;gap:5px;flex-wrap:wrap}
.mchip{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 9px}
.mchip.p{background:var(--accent);color:var(--accent-ink)}
.mchip.s{border:1.5px solid var(--accent);color:var(--fg)}
@media (max-width:380px){.mv{grid-template-columns:80px minmax(0,1fr) auto}.rec-v{grid-template-columns:1fr}}
.sheet>*{flex-shrink:0}
.srow.col>*{flex:none}
[hidden]{display:none!important}

.brand .ai{font:700 11px/1 var(--body);letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:3px 5px;margin-left:6px;vertical-align:3px}
.scanhero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 14px;display:flex;flex-direction:column;gap:12px}
.scanbtn{display:flex!important;align-items:center;justify-content:center;gap:10px;min-height:64px;font-size:20px}
.scanbtn svg,.scanlink svg,[data-act="ai-new"] svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;flex:none}
[data-act="ai-new"]{display:inline-flex;align-items:center;gap:8px}
.tipcard{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.scanres{display:flex;flex-direction:column;gap:12px}
.shot{position:relative;border-radius:var(--r);overflow:hidden;background:#000;display:flex;justify-content:center;min-height:120px}
.shot img{max-width:100%;max-height:32vh;object-fit:contain;display:block}
.shot-busy{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:17px}
.shot-busy .btn{background:rgba(255,255,255,.92);color:#111;border-color:transparent}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[data-motion="off"] .spin{animation-duration:3s}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.match-h{display:flex;gap:12px;align-items:center}
.match-h h2{margin:2px 0 4px}
.conf{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:3px 9px;background:var(--sunk);color:var(--muted)}
.conf.high{background:var(--good-soft);color:var(--good)}
.conf.medium{background:var(--accent-soft);color:var(--accent)}
.seen{margin:0;font-style:italic}
.warnline{margin:0;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.alts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mtile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit}
.mtile b{font:600 16px/1.15 var(--display)}
.mt-i{display:block;background:var(--plate);border-radius:8px;aspect-ratio:16/10;overflow:hidden}
.mt-i img{width:100%;height:100%;object-fit:contain;display:block}
.mt-i.sm{width:92px;flex:none}

.mph svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.5}
.backbtn{align-self:flex-start;margin-bottom:-6px}
.rvw{display:inline-block;margin-left:6px;color:var(--good);background:var(--good-soft);border-radius:999px;padding:2px 8px;letter-spacing:.04em}
.mg{gap:10px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px;font-size:15px;line-height:1.4}
.steps.sm{font-size:14px;gap:4px}
.steps li::marker{font-weight:700;color:var(--accent)}
.mex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.mex:first-of-type{border-top:0;padding-top:0}
.mex-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mex-h>div{display:flex;flex-direction:column;gap:2px}
.mex-h b{font:600 19px/1.15 var(--display)}
.mex p{margin:0}
.addbtn{width:100%}
.addbtn[disabled]{opacity:1;background:var(--good-soft);color:var(--good);border-color:transparent}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist>div{display:flex;flex-direction:column;gap:1px}
.safety ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.addh{padding-top:4px}
.rmx{align-self:center;margin:0 0 10px}
.scanlink{display:flex;align-items:center;gap:10px;justify-content:center;padding:12px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--fg);text-decoration:none;font-size:14.5px}
.scanlink svg{color:var(--accent)}
.okline{color:var(--good);font-weight:600}
#ai-relay{font:500 15px/1 var(--body);flex:1;min-width:0}
.toast .tact{margin-left:10px;background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.toast{pointer-events:auto}
.mex-h .btn{white-space:nowrap;flex:none}

function lastText(e,last){if(!last)return "No previous log yet";return `Last (${new Date(last.date+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})}): `+last.sets.map(x=>(num(x.kg)!=null&&!repsMode(e)?fmt(num(x.kg))+"×":"")+x.reps+(e.u==="sec"?"s":"")).join(" · ")}

/* home session */
function secExs(w,sk){return w.ex.filter(e=>e.sec===sk)}

function curRound(d,exs,n){for(let j=0;j<n;j++){if(!exs.every(e=>{const s=d.entries[e.id].sets[j];return s&&s.done}))return j}return n-1}
function homeBody(w,d,wk){let h="";

    h+=`<div class="sec-h" id="sec-${sk}"><div><h2>${sec.title}</h2><span class="muted small">${sec.sub(n)}</span></div>`;
    if(n>1)h+=`<div class="rounds"><span>Round</span>${Array.from({length:n},(_,j)=>{const fin=exs.every(e=>{const s=d.entries[e.id].sets[j];return s&&s.done});return `<button data-act="round" data-sec="${sk}" data-j="${j}" aria-pressed="${j===view}" class="${fin?"fin":""}" aria-label="Round ${j+1}${fin?", done":""}">${j+1}</button>`}).join("")}</div>`;
    h+=`</div><div class="hrows">${exs.map(e=>homeRow(e,d.entries[e.id],view,wk)).join("")}</div>`}
  return h}
function homeRow(e,en,j,wk){
  const set=en.sets[Math.min(j,en.sets.length-1)];const jj=Math.min(j,en.sets.length-1);const last=isLogged(e)?lastFor(e.id):null;

  const act=setAct(e,set,jj,last);
  const lastTxt=last?`Last: ${last.sets.map(x=>x.reps+(e.u==="sec"?"s":"")).join(" · ")}`:esc(e.m);
  return `<article class="hrow ${set.done?"done":""}" id="h-${e.id}"><button class="plate" data-act="zoom" data-ex="${e.id}" aria-label="Enlarge ${esc(e.n)} illustration"><img src="${img(e.id)}" alt="${esc(e.n)}" loading="lazy"></button>
   <div style="min-width:0"><h3>${esc(e.n)}${set.pr?' <span class="prbadge">PR</span>':""}</h3><div class="tgt">${esc(tgtTxt)}</div><div class="mus">${lastTxt}</div></div><div class="hact">${act}</div></article>`}
function setAct(e,set,jj,last){
  let act="";
  if(e.k==="check")act=`<button class="tick ${set.done?"on":""}" data-act="hdone" data-ex="${e.id}" data-j="${jj}" aria-label="Mark ${esc(e.n)} done">${ICON.check}</button>`;
  else if(e.k==="reps"){const p=last&&last.sets[jj];act=`<input class="hin" id="i-${e.id}-${jj}-reps" inputmode="${IM("numeric")}" placeholder="${p?esc(p.reps):(/^\d+( per \w+)?$/.test(e.r)?topOf(e.r):"reps")}" value="${esc(set.reps)}" data-ex="${e.id}" data-j="${jj}" data-f="reps" aria-label="${esc(e.n)} reps"><button class="tick ${set.done?"on":""}" data-act="hdone" data-ex="${e.id}" data-j="${jj}" aria-label="Mark ${esc(e.n)} done">${ICON.check}</button>`}
  else if(set.done)act=`${e.k==="hold"?`<span class="held">${esc(set.reps)} s</span>`:""}<button class="tick on" data-act="hdone" data-ex="${e.id}" data-j="${jj}" aria-label="Undo ${esc(e.n)}">${ICON.check}</button>`;
  else act=`<button class="btn primary" data-act="hold" data-ex="${e.id}" data-j="${jj}">Start</button>${e.k==="stretch"?`<button class="tick" data-act="hdone" data-ex="${e.id}" data-j="${jj}" aria-label="Mark ${esc(e.n)} done without the timer">${ICON.check}</button>`:""}`;

function afterHomeDone(e,j){const d=ensureDraft();const w=WBY.D;const exs=secExs(w,e.sec);const roundDone=exs.every(x=>{const s=d.entries[x.id].sets[j];return s&&s.done});const n=roundsOf(d,exs);
  if(e.sec==="holds"&&!(roundDone&&j===n-1))startRest(30);
  if(roundDone&&SECS[e.sec].rounds){S.round[e.sec]=null;if(e.sec==="circuit"&&j<n-1){startRest(60);toast(`Round ${j+1} done. Rest 60 s.`)}else if(j===n-1)toast(`${SECS[e.sec].title} done`)}}

function seriesFor(exId,mode){const out=[];const e=EXBY[exId];[...S.sessions].sort((a,b)=>(a.date+a.finishedAt).localeCompare(b.date+b.finishedAt)).forEach(s=>{const sets=loggedSets(s.entries&&s.entries[exId]);if(!sets.length)return;
  const useReps=repsMode(e)||(e.bw&&sets.every(x=>!num(x.kg)));
  let v;if(useReps)v=Math.max(...sets.map(x=>num(x.reps)));else if(mode==="e1"){const os=sets.map(x=>orm(num(x.kg)??0,num(x.reps))).filter(x=>x!=null);if(!os.length)return;v=Math.max(...os)}else v=Math.max(...sets.map(x=>num(x.kg)??0));
  out.push({date:s.date,v,useReps})});return out}
function spark(pts){const W=320,H=84,p=6;if(pts.length<2)return "";const vs=pts.map(x=>x.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi===lo){hi+=1;lo-=1}
  const X=i=>p+i*(W-2*p)/(pts.length-1),Y=v=>H-p-(v-lo)*(H-2*p-10)/(hi-lo);
  const d=pts.map((q,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(q.v).toFixed(1)).join(" ");
  const area=d+` L${X(pts.length-1).toFixed(1)} ${H} L${X(0).toFixed(1)} ${H} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Trend"><line x1="0" x2="${W}" y1="${H-.5}" y2="${H-.5}" stroke="var(--line)"/><path d="${area}" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.v)}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`).join("")}</svg>`}
function seg(name,val,opts,act){return `<div class="seg" role="radiogroup" aria-label="${esc(name)}">${opts.map(([v,l])=>`<button role="radio" aria-checked="${v===val}" data-act="${act||"pref"}" data-k="${name}" data-v="${v}">${l}</button>`).join("")}</div>`}
function viewLifts(){

  withData.forEach(([id,pts])=>{const e=EXBY[id];const last=pts[pts.length-1],first=pts[0];const diff=last.v-first.v;const best=Math.max(...pts.map(x=>x.v));const unit=last.useReps?unitOf(e):"kg";

const gNames=ids=>(ids||[]).map(i=>MBY[i]?MBY[i].n:i).join(", ");
const PALS=[{"id": "chalk", "n": "Chalk", "sw": ["#f3f3f0", "#d4442a"]}, {"id": "ocean", "n": "Ocean", "sw": ["#edf2f6", "#1d6fb8"]}, {"id": "forest", "n": "Forest", "sw": ["#eef2ec", "#3b7a35"]}, {"id": "plum", "n": "Plum", "sw": ["#f4f0f6", "#8a3ca6"]}, {"id": "sand", "n": "Sand", "sw": ["#f5efe4", "#b0621b"]}, {"id": "rose", "n": "Rose", "sw": ["#f7eff1", "#c2185b"]}];

function bodySVG(prim,sec,cls,label){
  const P=new Set(),Q=new Set();
  const add=(set,ids)=>(ids||[]).forEach(m=>{const g=MBY[m];if(!g)return;for(const s of ["F","B"])(g.map[s]||[]).forEach(k=>set.add(s+k))});
  add(P,prim);add(Q,sec);
  const half=(pts,cx)=>[pts.map(([x,y])=>[cx+x,y]),pts.slice().reverse().map(([x,y])=>[cx-x,y])];
  const poly=(p,f,st,c)=>`<polygon ${c?`class="${c}" `:""}points="${p.map(q=>q.join(",")).join(" ")}" fill="${f}" stroke="${st}" stroke-width="1.3" stroke-linejoin="round"/>`;
  const fig=(side,cx)=>{const [r,l]=half(BODY.sil,cx);let o=poly(r.concat(l),"var(--sunk)","var(--line)")+`<circle cx="${cx}" cy="24" r="15" fill="var(--sunk)" stroke="var(--line)" stroke-width="1.3"/>`;
    for(const k in BODY[side]){const key=side+k;const f=P.has(key)?"var(--accent)":Q.has(key)?"var(--hl2)":"var(--line)";const [a,b]=half(BODY[side][k],cx);const hc=P.has(key)?"hi":"";o+=poly(a,f,"var(--surface)",hc)+poly(b,f,"var(--surface)",hc)}return o};
  return `<svg class="${cls||"body"}" viewBox="0 4 240 362" role="img" aria-label="${esc(label||("Muscle map: "+gNames(prim)))}">${fig("F",60)}${fig("B",180)}<text class="lbl" x="60" y="362" text-anchor="middle">FRONT</text><text class="lbl" x="180" y="362" text-anchor="middle">BACK</text></svg>`}

/* ---------- v3: custom programmes and weekly plan ---------- */
function normSettings(x){x=x||{};const p=x.plan||{};const lay=l=>({rep:Object.assign({},l&&l.rep),add:Array.isArray(l&&l.add)?l.add.slice():[]});const weeks={};for(const k in (p.weeks||{}))weeks[k]=lay(p.weeks[k]);
  return {startDate:x.startDate||null,restDays:[1,2,3].includes(+x.restDays)?+x.restDays:1,mobility:Array.isArray(x.mobility)?x.mobility.filter(m=>m&&m.date):[],customs:Array.isArray(x.customs)?x.customs.filter(c=>c&&c.id&&Array.isArray(c.ex)):[],plan:{base:lay(p.base),weeks}}}
function customBy(id){return (S.settings.customs||[]).find(c=>c.id===id)||null}
function toISO(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function isoAdd(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return toISO(d)}
const fmtD=iso=>new Date(iso+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
function weekKey(){const sd=S.settings.startDate;if(!sd)return null;const n=Math.max(0,daysBetween(sd,todayISO()));return isoAdd(sd,Math.floor(n/7)*7)}
function planLayer(){const k=weekKey();const p=S.settings.plan;return (k&&p.weeks[k])||p.base}
function weekOrder(){const L=planLayer();const o=ORDER.map(l=>L.rep[l]&&customBy(L.rep[l])?L.rep[l]:l);L.add.forEach(id=>{if(customBy(id)&&!o.includes(id))o.push(id)});return o}
function focusOf(c){const cnt={};c.ex.forEach(x=>{const e=EXBY[x.id];(e&&e.g||[]).forEach(g=>cnt[g]=(cnt[g]||0)+1)});return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3).map(g=>MBY[g].n).join(", ")||"Custom"}
function customW(id){const c=customBy(id);if(!c)return null;
  const ex=c.ex.map(x=>{const b=EXBY[x.id];if(!b)return null;const o={...b,s:Math.max(1,parseInt(x.s)||b.s||3),r:x.r||b.r,ss:undefined};if(x.t){o.t=parseInt(x.t)||b.t;o.inc=0;o.max=o.t}return o}).filter(Boolean);
  return {id,custom:1,name:c.name,pill:"Custom",tag:"Custom",focus:focusOf(c),cardio:"Your own programme. Warm up for 5–10 minutes first, then work through the list in order.",ex}}
function wdef(id){return WBY[id]||customW(id)}
function curEx(id){const w=S.draft&&wdef(S.draft.current);return (w&&w.ex.find(x=>x.id===id))||EXBY[id]}
function sessName(s){const c=customBy(s.workout);return (c&&c.name)||s.name||wname(s.workout)}
function wvar(id){if(WBY[id])return "--w"+id.toLowerCase();if(id==="UA"||id==="UB")return "--wb";if(id==="LA"||id==="LB")return "--wa";return "--wx"}
function wletter(id,name){if(WBY[id])return id;if(LEGACY_W[id])return LEGACY_W[id][0];const c=customBy(id);const n=((c&&c.name)||name||"").trim();if(!n)return "★";const p=n.split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase()}
function homeAfter(e,j){if(S.draft&&S.draft.current==="D")afterHomeDone(e,j);else if(e.k==="hold")startRest(30)}
function planSummary(){const L=planLayer();const parts=[];ORDER.forEach(l=>{const c=L.rep[l]&&customBy(L.rep[l]);if(c)parts.push(`${c.name} replaces ${l}`)});const ad=L.add.map(customBy).filter(Boolean);if(ad.length)parts.push("+ "+ad.map(c=>c.name).join(", "));return parts.length?"This week: "+parts.join(" · "):"Standard plan: A → B → C → D"}
function applyPlan(scope,fn){const p=S.settings.plan;
  if(scope==="base"){fn(p.base);const k=weekKey();if(k&&p.weeks[k])fn(p.weeks[k])}
  else{if(!S.settings.startDate)S.settings.startDate=todayISO();const k=weekKey();if(!p.weeks[k])p.weeks[k]=JSON.parse(JSON.stringify(p.base));fn(p.weeks[k])}
  for(const k in p.weeks)if(daysBetween(k,todayISO())>70)delete p.weeks[k];
  if(S.draft&&S.draft.current&&!weekOrder().includes(S.draft.current)&&!hasData(S.draft.current)){if(S.draft.workouts)delete S.draft.workouts[S.draft.current];S.draft.current=nextWorkout();saveDraft()}
  saveSettings()}
const dropFrom=(L,id)=>{for(const l in L.rep)if(L.rep[l]===id)delete L.rep[l];L.add=L.add.filter(x=>x!==id)};
function usedIn(id){const out=WORKOUTS.filter(w=>w.ex.some(e=>e.id===id)).map(w=>`<span class="wb" style="background:var(${wvar(w.id)})">${w.id}</span>`);
  (S.settings.customs||[]).forEach(c=>{if(c.ex.some(x=>x.id===id))out.push(`<span class="wb" style="background:var(--wx)">${esc(c.name)}</span>`)});
  return out.length?out.join(""):'<span class="wb lib">Library</span>'}
function exFor(f){if(!f||f==="all")return LIBRARY.slice();const [k,v]=f.split(":");
  if(k==="m"){const a=LIBRARY.filter(id=>EXBY[id].g.includes(v)),b=LIBRARY.filter(id=>!EXBY[id].g.includes(v)&&EXBY[id].g2.includes(v));return a.concat(b)}
  if(k==="t")return LIBRARY.filter(id=>EXBY[id].ty.includes(v));
  if(k==="w"&&WBY[v])return WBY[v].ex.map(e=>e.id);return LIBRARY.slice()}

function kCard(e,en,wk){const last=isLogged(e)?lastFor(e.id):null;const allDone=en.sets.length&&en.sets.every(x=>x.done);
  const tgt=(e.k==="hold"||e.k==="stretch")?(en.t||holdTarget(e,wk)):null;
  const tgtTxt=tgt?`${en.sets.length} × ${tgt} s${e.side?" per side":""}`:`${en.sets.length} × ${e.r}`;
  const lab=x=>e.k==="hold"?(x.done?"Held"+(x.pr?' <span class="prbadge">PR</span>':""):`${tgt} s hold`):e.k==="stretch"?`${tgt} s stretch`:e.k==="check"?esc(e.r):(x.pr?'<span class="prbadge">PR</span>':esc(e.r));
  return `<article class="ex ${allDone?"done":""}" id="ex-${e.id}"><div class="ex-head"><button class="plate" data-act="zoom" data-ex="${e.id}" aria-label="Enlarge ${esc(e.n)} illustration"><img src="${img(e.id)}" alt="${esc(e.n)}"></button>
   <div class="ex-meta"><h3>${esc(e.n)}</h3><div class="tgt">${esc(tgtTxt)}</div><div class="mus">${esc(e.m)}</div>${last?`<div class="last">${esc(lastText(e,last))}</div>`:""}</div></div>
   <div class="sets"><div class="krows">${en.sets.map((x,j)=>`<div class="krow ${x.done?"ok":""}"><span class="n">${j+1}</span><span class="kl">${lab(x)}</span><span class="hact">${setAct(e,x,j,last)}</span></div>`).join("")}</div>
   <div class="cue">${esc(e.c)}</div><div class="tools"><span></span><button class="btn ghost sm" data-act="addset" data-ex="${e.id}">+ Set</button></div></div></article>`}

function newBuild(c){return {id:c?c.id:null,name:c?c.name:`Custom ${(S.settings.customs||[]).length+1}`,ex:c?c.ex.map(x=>({...x})):[],filter:"all",q:""}}
function exDefaults(id){const e=EXBY[id];const o={id,s:e.s||3,r:e.r||"8–12"};if(e.k==="hold"||e.k==="stretch")o.t=e.t||30;return o}
function filterOptions(sel){const o=(v,l)=>`<option value="${v}" ${v===sel?"selected":""}>${esc(l)}</option>`;
  return o("all","All exercises")+`<optgroup label="Muscle group">${MUSCLES.map(m=>o("m:"+m.id,m.n)).join("")}</optgroup><optgroup label="Type">${TYPES.map(t=>o("t:"+t.id,t.n)).join("")}</optgroup><optgroup label="From a workout">${WORKOUTS.map(w=>o("w:"+w.id,w.id+" · "+w.name)).join("")}</optgroup>`}
function bItem(x,i,n){const e=EXBY[x.id];const timed=e.k==="hold"||e.k==="stretch";
  return `<div class="bitem"><div class="plate"><img src="${img(x.id)}" alt="" loading="lazy"></div><div style="min-width:0">
   <div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><h3>${i+1}. ${esc(e.n)}</h3><div class="row" style="flex-wrap:nowrap;gap:4px"><button class="iconbtn" data-act="b-up" data-i="${i}" ${i?"":"disabled"} aria-label="Move ${esc(e.n)} up">↑</button><button class="iconbtn" data-act="b-down" data-i="${i}" ${i<n-1?"":"disabled"} aria-label="Move ${esc(e.n)} down">↓</button><button class="iconbtn" data-act="b-rm" data-i="${i}" aria-label="Remove ${esc(e.n)}">✕</button></div></div>
   <div class="bctl"><label for="b-s-${i}">Sets</label><input class="sn" id="b-s-${i}" inputmode="numeric" data-bf="s" data-i="${i}" value="${esc(x.s)}">${timed?`<label for="b-t-${i}">Seconds</label><input class="rt" id="b-t-${i}" inputmode="numeric" data-bf="t" data-i="${i}" value="${esc(x.t||"")}">`:e.k==="check"?`<span class="muted small">${esc(e.r)}</span>`:`<label for="b-r-${i}">${e.u==="sec"?"Target":"Reps"}</label><input class="rt" id="b-r-${i}" data-bf="r" data-i="${i}" value="${esc(x.r)}">`}</div></div></div>`}
function bList(){const B=S.build;const q=(B.q||"").trim().toLowerCase();const ids=exFor(B.filter).filter(id=>!q||EXBY[id].n.toLowerCase().includes(q)||gNames(EXBY[id].g).toLowerCase().includes(q));
  if(!ids.length)return `<div class="empty">No exercises match. Try another filter or search.</div>`;
  return ids.map(id=>{const e=EXBY[id];const on=B.ex.some(x=>x.id===id);return `<div class="exrow"><button class="plate" data-act="zoom" data-ex="${id}" aria-label="Enlarge ${esc(e.n)}"><img src="${img(id)}" alt="" loading="lazy"></button><div style="min-width:0"><h3>${esc(e.n)}</h3><div class="mus">${esc(gNames(e.g))}</div><div class="badges">${e.ty.map(t=>`<span class="tchip">${TBY[t].n}</span>`).join("")}</div></div><button class="btn sm addbtn" data-act="b-toggle" data-ex="${id}" aria-pressed="${on}">${on?"Added":"Add"}</button></div>`}).join("")}
function viewBuild(){if(!S.build)S.build=newBuild();const B=S.build;
  return `<section class="view"><div class="stack" style="gap:6px"><div class="eyebrow">${B.id?"Edit custom programme":"New custom programme"}</div><h1>${B.id?"Edit programme":"Build a programme"}</h1><div class="muted">Pick any exercises, set the sets and reps, then save.</div></div>
   <div class="stack" style="gap:6px"><label for="b-name" style="font-weight:600">Name</label><input id="b-name" class="tin" data-bf="name" value="${esc(B.name)}" maxlength="30" autocomplete="off"></div>
   <div class="sec-h"><div><h2>Selected · ${B.ex.length}</h2><span class="muted small">${B.ex.length?"Done in this order. Use the arrows to reorder.":"Nothing yet. Add exercises from the list below."}</span></div></div>

/* plan */
function viewPlan(){const sc=S.planScope||"week";const k=weekKey();const p=S.settings.plan;const L=sc==="base"?p.base:((k&&p.weeks[k])||p.base);const cs=S.settings.customs;
  const range=k?`${fmtD(k)} – ${fmtD(isoAdd(k,6))}`:"starting with your next workout";
  let h=`<section class="view"><div class="stack" style="gap:6px"><div class="eyebrow">Weekly plan</div><h1>Plan and custom</h1><div class="muted">Swap any session for one of your own programmes, or add extra sessions. The rotation still runs in order.</div></div>

   ${L.add.map(customBy).filter(Boolean).map(c=>`<div class="slot"><span class="lt" style="background:var(--wx)">+</span><div style="min-width:0"><h3>${esc(c.name)}</h3><span class="muted small">Extra session · ${c.ex.length} exercises</span></div><button class="btn sm" data-act="plan-unadd" data-c="${c.id}">Remove</button></div>`).join("")}
   <button class="btn" data-act="plan-addextra">+ Add an extra session</button></div>`;

  if(!cs.length)h+=`<div class="empty">Build your own workout from any of the ${LIBRARY.length} exercises. Then do it as a one-off, swap it in for a session, or add it as an extra.</div>`;
  cs.forEach(c=>{h+=`<div class="cust"><div style="min-width:0"><h3>${esc(c.name)}</h3><span class="muted small">${c.ex.length} exercise${c.ex.length===1?"":"s"} · ${esc(focusOf(c))}</span></div><div class="thumbs">${c.ex.slice(0,6).map(x=>`<div class="plate"><img src="${img(x.id)}" alt="" loading="lazy"></div>`).join("")}</div>
    <div class="row"><button class="btn sm primary" data-act="use-today" data-c="${c.id}">Do today</button><button class="btn sm" data-act="use-open" data-c="${c.id}">Use in plan</button><button class="btn sm" data-act="b-edit" data-c="${c.id}">Edit</button><button class="btn sm ghost" data-act="c-del" data-c="${c.id}">Delete</button></div>
    ${S.confirm==="cdel:"+c.id?`<div class="confirm"><span>Delete ${esc(c.name)}? Workouts you've already logged with it stay in your history.</span><div class="row"><button class="btn danger" data-act="c-del-yes" data-c="${c.id}">Delete</button><button class="btn" data-act="cancel">Cancel</button></div></div>`:""}</div>`});
  return h+"</section>"}
